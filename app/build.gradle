plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The release workflow passes the version from the git tag (-PversionName=1.2.3).
// Local builds fall back to a development version.
def appVersionName = (findProperty('versionName') ?: '0.0.0-dev').toString()

/**
 * Derives the Play Store version code from a semantic version name:
 * 1.2.3 -> 10203. Each component may go up to 99; a pre-release suffix such as
 * "-beta1" is ignored, so pre-releases share the code of their final release.
 */
def versionCodeFor = { String name ->
    def matcher = name =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!matcher.find()) {
        throw new GradleException("versionName '$name' must start with MAJOR.MINOR.PATCH")
    }
    def (major, minor, patch) = (1..3).collect { matcher.group(it) as int }
    if (minor > 99 || patch > 99) {
        throw new GradleException("versionName '$name': minor and patch must be below 100")
    }
    // Never 0: Android requires a positive version code.
    Math.max(1, major * 10000 + minor * 100 + patch)
}

android {
    namespace 'io.github.pasmon.mechboard'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.pasmon.mechboard"
        minSdk 21
        targetSdk 36
        versionCode versionCodeFor(appVersionName)
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            // Robolectric tests inflate real layouts, themes and drawables.
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
